<!DOCTYPE html>
<html lang="zh-CN" data-theme="parchment">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中英双语对照圣经 | 和合本 (CUV) 与 经典老版 (NIV 1984)</title>
  <meta name="description" content="典雅的中英双语对照圣经阅读器。收录中文简体和合本 (CUV) 与经典 1984 年版新国际版 (NIV 1984)，集成纯前端高质量英文朗读与跟随高亮、并排与穿插对照双排版模式。">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b38738'><path d='M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h2v5l-1-.75L9 9V4zm9 16H6V4h1v7l2.5-1.88L12 11V4h6v16z'/></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header" id="appHeader">
    <div class="brand-section" id="brandSection">
      <div class="brand-icon">†</div>
      <div class="brand-titles">
        <h1 class="text-display">Bilingual Scripture</h1>
        <div class="subtitle">和合本 (CUV) · NIV 1984 Edition</div>
      </div>
    </div>

    <!-- Center Navigator Trigger -->
    <button class="btn-nav-book" id="btnNavBook" title="选择书卷与章节">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span id="currentNavText">创世记 第1章</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:0.8rem; height:0.8rem;">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <!-- Right Controls -->
    <div class="header-actions">
      <!-- Layout Mode Toggle -->
      <div class="segmented-control" id="viewModeControl" title="排版视图">
        <button id="btnViewSide" class="active" title="左右双栏对照">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="8" height="18" rx="1"></rect>
            <rect x="13" y="3" width="8" height="18" rx="1"></rect>
          </svg>
          并排
        </button>
        <button id="btnViewInterlinear" title="上下逐节穿插对照">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          穿插
        </button>
      </div>

      <!-- Font Size Scaler -->
      <div class="segmented-control" title="经文字号调节">
        <button id="btnFontDec" title="字号减小">A-</button>
        <button id="btnFontInc" title="字号加大">A+</button>
      </div>

      <!-- Theme Switcher -->
      <button class="icon-button" id="btnTheme" title="切换主题风格（羊皮纸 / 洁白 / 深夜）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Secondary Scripture Toolbar (Pagination & Links) -->
  <div class="scripture-subbar" id="scriptureSubbar">
    <div class="chapter-pagination">
      <button id="btnPrevChapter" title="上一章">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        上一章
      </button>
      <span id="currentChapterDisplay" style="font-weight: 600; color: var(--text-muted);">1 / 50</span>
      <button id="btnNextChapter" title="下一章">
        下一章
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- PDF Source badge from christunite.com -->
    <a id="pdfSourceLink" class="pdf-source-link" href="#" target="_blank" rel="noopener noreferrer" title="查看对应 1984 版 PDF">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>NIV 1984 原版 PDF</span>
    </a>
  </div>

  <!-- Main Scripture Content Container -->
  <main class="main-content" id="mainContent">
    <!-- Chapter Title Hero -->
    <div class="book-title-hero" id="bookTitleHero">
      <h2 id="bookHeroTitle">创世记 第 1 章</h2>
      <div class="english-subhead" id="bookHeroEn">Genesis Chapter 1 (NIV 1984)</div>
      <div class="chapter-pill" id="chapterHeroPill">Chapter 1</div>
    </div>

    <!-- Verse Table Header (Only in Side-by-Side mode) -->
    <div class="scripture-header-row" id="scriptureHeaderRow">
      <div>中文和合本 (Chinese Union Version)</div>
      <div>New International Version (1984 Classic)</div>
    </div>

    <!-- Verses Container -->
    <div class="scripture-view-side" id="scriptureContainer">
      <!-- Verses dynamically injected here -->
    </div>
  </main>

  <!-- Floating Audio Player Bar -->
  <div class="audio-dock-container" id="audioDock">
    <div class="audio-track-info">
      <div class="audio-wave-icon" id="audioWaveIcon">
        <div class="wave-bars">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
      <div class="track-text">
        <div class="title" id="audioTrackTitle">Genesis Ch.1</div>
        <div class="status" id="audioTrackStatus">Ready (31 verses)</div>
      </div>
    </div>

    <!-- Main Buttons -->
    <div class="audio-main-controls">
      <button class="btn-ctrl" id="btnDockPrev" title="朗读上一节">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>

      <button class="btn-play-pause" id="btnDockPlay" title="播放 / 暂停英文朗读">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>

      <button class="btn-ctrl" id="btnDockNext" title="朗读下一节">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>
    </div>

    <!-- Audio Settings -->
    <div class="audio-settings">
      <div class="speed-selector" title="朗读语速">
        <select id="speedSelect">
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>

      <div class="voice-selector" title="发音人">
        <select id="voiceSelect">
          <option value="">默认英文发音</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Drawer: Book & Chapter Navigator -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="books-drawer" id="booksDrawer" aria-label="圣经卷目与章节选择">
    <div class="drawer-header">
      <h3>圣经卷目目录</h3>
      <button class="icon-button" id="btnCloseDrawer" title="关闭目录">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="search-box">
      <input type="text" id="bookSearchInput" placeholder="搜索经卷（例如：创世记 / Genesis）...">
    </div>

    <div class="drawer-tabs">
      <button class="drawer-tab-btn active" id="drawerTabOT">旧约 (Old Testament)</button>
      <button class="drawer-tab-btn" id="drawerTabNT">新约 (New Testament)</button>
    </div>

    <div class="drawer-book-list" id="drawerBookList">
      <!-- Book items dynamically rendered -->
    </div>
  </aside>

  <!-- Scripts -->
  <script src="js/bible-data.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
